[workspace]
members = [".", "irithyll-python", "irithyll-core", "irithyll-cli"]

[package]
name = "irithyll"
version = "10.0.1"
edition = "2021"
rust-version = "1.75"
description = "Streaming ML in Rust -- gradient boosted trees, neural architectures (TTT/KAN/MoE/Mamba/SNN), AutoML, kernel methods, and composable pipelines"
license = "MIT OR Apache-2.0"
repository = "https://github.com/evilrat420/irithyll"
readme = "README.md"
documentation = "https://docs.rs/irithyll"
keywords = ["machine-learning", "gradient-boosting", "streaming", "online-learning", "automl"]
categories = ["algorithms", "science"]
exclude = [".claude/", "irithyll-python/", "irithyll-core/", "irithyll-cli/", "marketing/"]

[dependencies]
parking_lot = "0.12"
tokio = { version = "1", features = ["rt", "sync", "macros"] }
futures-core = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", optional = true }
bincode = { version = "2", features = ["serde"], optional = true }
thiserror = "2.0"
tracing = "0.1"
irithyll-core = { path = "irithyll-core", version = "1.0.0", features = ["std", "serde"] }

# Optional acceleration dependencies (activated via feature flags)
rayon = { version = "1.10", optional = true }

# Arrow/Parquet ecosystem
arrow = { version = "54", optional = true, default-features = false, features = ["prettyprint"] }
parquet = { version = "54", optional = true, features = ["arrow"] }

# ONNX export
prost = { version = "0.13", optional = true }

[dev-dependencies]
proptest = "1.5"
rand = { version = "0.8", features = ["small_rng"] }
approx = "0.5"
criterion = { version = "0.5", features = ["html_reports"] }
tokio = { version = "1", features = ["full"] }

[features]
default = ["serde-json"]
serde-json = ["dep:serde_json", "irithyll-core/serde"]
serde-bincode = ["dep:bincode", "irithyll-core/serde"]
kmeans-binning = ["irithyll-core/kmeans-binning"]
simd = ["irithyll-core/simd"]
simd-avx2 = ["irithyll-core/simd-avx2"]
parallel = ["dep:rayon", "irithyll-core/parallel"]
arrow = ["dep:arrow"]
parquet = ["dep:parquet", "arrow"]
onnx = ["dep:prost"]
neural-leaves = []
# Knowledge distillation for WelfordRace (AM-15). Default OFF.
# Enable only after post-restart telemetry confirms winner flipping between
# 2+ configs that capture genuinely different market regimes.
distill = []
full = ["serde-json", "serde-bincode", "kmeans-binning", "parallel", "arrow", "parquet", "onnx", "neural-leaves", "simd", "simd-avx2"]

[package.metadata.docs.rs]
features = ["full"]
rustdoc-args = ["--cfg", "docsrs"]

