name: Deploy Rustdoc to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Nightly is required because `--cfg docsrs` activates
      # `#![cfg_attr(docsrs, feature(doc_cfg))]` at the crate root, and
      # `feature(...)` is a nightly-only opt-in. docs.rs itself builds on
      # nightly, so this matches the toolchain that powers the published docs.
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Build documentation
        env:
          RUSTDOCFLAGS: "--cfg docsrs -Dwarnings"
        run: cargo doc --no-deps --all-features
      - name: Add redirect index.html
        run: echo '<meta http-equiv="refresh" content="0; url=irithyll/index.html">' > target/doc/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/doc

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
